name: 🚀 Deploy a Servidor SIMO con pnpm

on:
  push:
    branches:
      - simo  # Se ejecuta solo cuando hagas push a esta rama

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🛠 Clonar el repositorio
        uses: actions/checkout@v3

      - name: 📦 Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Instalar pnpm globalmente
        run: npm install -g pnpm

      - name: 📥 Instalar dependencias con pnpm
        run: pnpm install --no-frozen-lockfile

      - name: Crear .env.production
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL_SIMO }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_MAPBOX_KEY: ${{ secrets.VITE_MAPBOX_KEY }}
          VITE_API_ORGANIZATION: 'simo'
        run: |
          echo "VITE_API_BASE_URL=$VITE_API_BASE_URL" >> .env.production
          echo "VITE_GOOGLE_MAPS_API_KEY=$VITE_GOOGLE_MAPS_API_KEY" >> .env.production
          echo "VITE_MAPBOX_KEY=$VITE_MAPBOX_KEY" >> .env.production
          echo "VITE_API_ORGANIZATION=$VITE_API_ORGANIZATION" >> .env.production

      - name: 🔨 Construir el proyecto con pnpm
        run: pnpm run build

      - name: 📤 Subir archivos al servidor (SIMO)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST_SIMO }}
          username: ${{ secrets.SSH_USER_SIMO }}
          key: ${{ secrets.SSH_PRIVATE_KEY_SIMO }}
          source: "dist/*"
          target: ${{ secrets.DEPLOY_TARGET_SIMO }}

      - name: 🔄 Reiniciar Servidor (Opcional)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST_SIMO }}
          username: ${{ secrets.SSH_USER_SIMO }}
          key: ${{ secrets.SSH_PRIVATE_KEY_SIMO }}
          script: |
            echo "Despliegue completado en SIMO usando pnpm"


